# neo4j.conf — оптимизирован под 4 GB RAM VDS
# Полный список опций: https://neo4j.com/docs/operations-manual/current/configuration/

# ── Память ────────────────────────────────────────────────
server.memory.heap.initial_size=512m
server.memory.heap.max_size=1g
server.memory.pagecache.size=512m

# ── Транзакции ────────────────────────────────────────────
# Ограничиваем память на транзакцию, чтобы один тяжёлый запрос
# не положил JVM
db.memory.transaction.total.max=512m
db.memory.transaction.max=128m

# ── Сеть ──────────────────────────────────────────────────
server.bolt.listen_address=0.0.0.0:7687
server.http.listen_address=0.0.0.0:7474
# HTTPS-интерфейс Neo4j отключаем — Caddy терминирует TLS снаружи
server.https.enabled=false

# ── Logging ───────────────────────────────────────────────
db.logs.query.enabled=INFO
# Медленные запросы (>1 сек) — логируем
db.logs.query.threshold=1000ms

# ── APOC ──────────────────────────────────────────────────
dbms.security.procedures.unrestricted=apoc.*
dbms.security.procedures.allowlist=apoc.*

# ── Производительность ────────────────────────────────────
# Для Community Edition без кластера — отключаем ненужное
db.checkpoint.interval.time=15m
db.checkpoint.interval.tx=100000
